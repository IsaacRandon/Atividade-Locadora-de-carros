<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDrive - Locadora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="pagina3.css">
</head>
<body class="bg-black text-light min-vh-100 d-flex flex-column justify-content-between">
<nav class="navbar navbar-expand-lg bg-dark border-bottom border-secondary shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="#"><i class="bi bi-car-front-fill fs-3"></i><span>DevTeam</span></a>
<button class="navbar-toggler bg-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link text-light" href="index.html">Equipe</a></li>
<li class="nav-item"><a class="nav-link text-light" href="pagina2.html">Locadora</a></li>
<li class="nav-item"><a class="nav-link active text-danger fw-bold border-bottom border-danger border-2" href="pagina3.html">Frota</a></li>
</ul>
</div>
</div>
</nav>
<main class="container py-5">
<div class="text-center mb-4">
<span class="badge bg-danger bg-opacity-10 text-danger px-3 py-2 rounded-pill mb-3">Frota Completa</span>
<h1 class="display-4 fw-bold mb-2 text-white">Escolha o seu Veículo</h1>
<p class="text-secondary">Locação semanal (máximo de 10 semanas).</p>
<button class="btn btn-outline-danger rounded-pill px-4 mt-3" onclick="compararCarrosSelecionados()">
<i class="bi bi-arrow-left-right me-2"></i> Comparar Selecionados (<span id="contadorComparacao">0</span>)
</button>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4" id="gridCarros"></div>
<div class="d-flex justify-content-center mt-5">
<ul class="pagination">
<li class="page-item"><a class="page-link bg-dark border-secondary text-danger" href="index.html">&laquo;</a></li>
<li class="page-item"><a class="page-link bg-dark border-secondary text-light" href="index.html">1</a></li>
<li class="page-item"><a class="page-link bg-dark border-secondary text-light" href="pagina2.html">2</a></li>
<li class="page-item active"><a class="page-link bg-danger border-danger text-white" href="pagina3.html">3</a></li>
<li class="page-item"><a class="page-link bg-dark border-secondary text-danger" href="pagina3.html">&raquo;</a></li>
</ul>
</div>

</main>
<div id="rentalOverlay" class="rental-overlay d-none align-items-center justify-content-center p-4">
<div class="card bg-dark text-light border-secondary p-4 w-100" style="max-width: 500px;">
<div class="d-flex justify-content-between align-items-center mb-4">
<h3 class="fw-bold text-white m-0" id="modalCarTitle">Configurar Aluguel</h3>
<button type="button" class="btn-close btn-close-white" onclick="fecharSubmenu()"></button>
</div>
<form onsubmit="finalizarAluguel(event)">
<div class="mb-3">
<label class="form-label text-secondary small">Quantidade de Semanas (Máx: 10)</label>
<input type="number" id="inputSemanas" class="form-control bg-black text-light border-secondary" value="1" min="1" max="10" required oninput="calcularTotal()">
</div>
<div class="mb-3">
<label class="form-label text-secondary small">Multa de Atraso (10% do valor total)</label>
<input type="text" id="inputMulta" class="form-control bg-black text-light border-secondary" readonly value="R$ 0,00">
</div>
<div class="mb-4">
<label class="form-label text-secondary small">Proteção / Seguro Semanal</label>
<select id="selectSeguro" class="form-select bg-black text-light border-secondary" onchange="calcularTotal()">
<option value="0">Sem Seguro</option>
<option value="350">Parcial (+ R$ 350/sem)</option>
<option value="700" selected>Completo (+ R$ 700/sem)</option>
</select>

</div>
<div class="p-3 bg-black rounded border border-secondary mb-4 d-flex justify-content-between align-items-center">
<span class="text-secondary">Total Estimado:</span>
<span class="fs-4 fw-bold text-success" id="spanTotal">R$ 0,00</span>
</div>
<div class="d-flex gap-2">
<button type="button" class="btn btn-outline-secondary w-50 rounded-pill" onclick="fecharSubmenu()">Cancelar</button>
<button type="submit" class="btn btn-primary w-50 rounded-pill">Reservar</button>
</div>
</form>
</div>
</div>

<footer class="bg-dark text-secondary py-4 border-top border-secondary mt-auto text-center">
<small>&copy; 2026 DevTeam - Todos os direitos reservados.</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="pagina3.js"></script>
</body>
</html>
